<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechNova Academy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <h1>Welcome To TechNova Academy</h1>
  <p>Share your learning interests and <br>start your coding journey here.</p>
  <pre> </pre>
  <section id="form-1">
  <form>
    <div class="form-group">
      <label for="fullname" ><strong>Full Name</strong>*</label>
      <input type="text" name="fullname" id="fullname" required>
    </div>
      <br>
      <br>
      <div class="form-group">
      <label for="tel"><strong>Phone Number* </strong></label>
      <input type="tel" id="tel" name="tel" required>
      </div>
      <br>
      <br>
      <div>
      <label for="pro-exp"><strong>What Is Your Current Programming Experience</strong></label>
      <br>
      <br>
      <input type="radio" id="begin" name="pro-exp">
      <label for="begin">Beginner</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="radio" id="middle" name="pro-exp">
      <label for="middle">Intermediate</label>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="radio" id="end" name="pro-exp">
      <label for="end">Advanced</label>
      </div>
      <br>
      <br>
      <div class="form-group">
      <label for="enquiry"><strong>How Did You hear about TechNova Academy:</strong> </label>
      <br>
      <br>
      <input type="checkbox" id="html" name="enquiry">
      <label for="google">Google</label>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="checkbox" id="socials" name="enquiry">
      <label for="socials">Social Media</label>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="checkbox" id="friend" name="enquiry">
      <label for="friend">Friend</label>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <input type="checkbox" id="other" name="enquiry">
      <label for="other">Other</label>
      </div>
      <br>
      <div>
        <button type="submit"> Submit Form</button>
      </div>
      <hr>
      <div class="form-group">
       <h2>Subscribe to Our Monthly Newsletter</h2> 
       <p>Subscribe to receive weekly coding tips and <br>course updates straight to your inbox.</p>
       <form>
        <input type="email" id="email" name="email" placeholder="Enter Your Email Address" required>
        <div>
          <button type="submit">Subscribe </button>
        </div>
         </form>
      </div>
  </form>
  </section>
  <hr>
  <footer>
    <div class="social-links">
      <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-facebook"></i>
      </a>
      <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-instagram"></i>
      </a><a href="https://x.com" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-x-twitter"></i>
      </a><a href="https://github.com/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-github"></i>
      </a><a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-linkedin"></i>
      </a>
    </div>
  </footer>
</body>

</html>
